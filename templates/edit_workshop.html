{% extends "base.html" %}

{% block title %}Edit Workshop | Admin Panel{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 700px;">
  <div style="margin-bottom: 1.5rem;">
    <h2 style="font-size: 1.6rem; font-weight: 700;">Edit Workshop #{{ workshop['id'] }}</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem;">Update workshop timing, venue, seats, or completion status</p>
  </div>

  <form method="POST" action="{{ url_for('edit_workshop', workshop_id=workshop['id']) }}">
    <div class="form-group">
      <label for="title" class="form-label">Workshop Title</label>
      <input type="text" id="title" name="title" class="form-control" value="{{ workshop['title'] }}" required>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label for="category" class="form-label">Category</label>
        <select id="category" name="category" class="form-control" required>
          {% for cat in ['Technology', 'Crafts & Trades', 'Environment', 'Finance', 'Arts & Design', 'Culinary Arts'] %}
            <option value="{{ cat }}" {% if workshop['category'] == cat %}selected{% endif %}>{{ cat }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="trainer_name" class="form-label">Trainer Name</label>
        <input type="text" id="trainer_name" name="trainer_name" class="form-control" value="{{ workshop['trainer_name'] }}" required>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label for="workshop_date" class="form-label">Date (YYYY-MM-DD)</label>
        <input type="date" id="workshop_date" name="workshop_date" class="form-control" value="{{ workshop['workshop_date'] }}" required>
      </div>

      <div class="form-group">
        <label for="workshop_time" class="form-label">Time & Duration</label>
        <input type="text" id="workshop_time" name="workshop_time" class="form-control" value="{{ workshop['workshop_time'] }}" required>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label for="venue" class="form-label">Venue</label>
        <input type="text" id="venue" name="venue" class="form-control" value="{{ workshop['venue'] }}" required>
      </div>

      <div class="form-group">
        <label for="total_seats" class="form-label">Total Seats</label>
        <input type="number" id="total_seats" name="total_seats" class="form-control" min="1" max="500" value="{{ workshop['total_seats'] }}" required>
      </div>

      <div class="form-group">
        <label for="status" class="form-label">Status</label>
        <select id="status" name="status" class="form-control" required>
          <option value="upcoming" {% if workshop['status'] == 'upcoming' %}selected{% endif %}>Upcoming</option>
          <option value="completed" {% if workshop['status'] == 'completed' %}selected{% endif %}>Completed</option>
          <option value="cancelled" {% if workshop['status'] == 'cancelled' %}selected{% endif %}>Cancelled</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="description" class="form-label">Description</label>
      <textarea id="description" name="description" class="form-control" rows="5" required>{{ workshop['description'] }}</textarea>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
      <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
