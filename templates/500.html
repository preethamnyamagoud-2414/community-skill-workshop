{% extends "base.html" %}

{% block title %}500 - Server Error | SkillConnect{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 600px; margin: 3rem auto; padding: 3rem 2rem;">
  <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚠️</div>
  <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--neutral-900); margin-bottom: 0.5rem;">500 - Internal Server Error</h1>
  <p style="color: var(--neutral-500); font-size: 1rem; margin-bottom: 2rem;">
    An unexpected error occurred on our server. Our team has been notified. Please try again later.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Return to Homepage</a>
</div>
{% endblock %}
