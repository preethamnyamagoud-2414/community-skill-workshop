{% extends "base.html" %}

{% block title %}Sign In | SkillConnect{% endblock %}

{% block content %}
<div
  style="min-height: calc(80vh - 120px); display: flex; align-items: center; justify-content: center; padding: 1.5rem 0;">
  <div class="form-card"
    style="width: 100%; max-width: 480px; margin: 0 auto; box-shadow: var(--shadow-xl); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 2.75rem 2.5rem; background: var(--bg-surface);">

    <!-- Header Branding -->
    <div style="text-align: center; margin-bottom: 2.25rem;">
      <div class="brand-icon"
        style="margin: 0 auto 0.85rem; width: 48px; height: 48px; font-size: 1.5rem; border-radius: var(--radius-md);">
        🌿</div>
      <h2
        style="font-size: 1.85rem; font-weight: 800; color: var(--neutral-900); letter-spacing: -0.025em; margin-bottom: 0.35rem;">
        Welcome Back</h2>
      <p style="color: var(--neutral-500); font-size: 0.94rem; margin: 0;">Sign in to access your workshops and
        community profile</p>
    </div>

    <!-- Login Form -->
    <form method="POST" action="{{ url_for('login') }}" novalidate>
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next or '' }}">

      <div class="form-group">
        <label for="email" class="form-label" style="display: flex; align-items: center; gap: 0.35rem;">
          <span>Email Address</span>
        </label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com"
          value="{{ email or '' }}" required autofocus style="padding: 0.75rem 1rem;">
      </div>

      <div class="form-group" style="margin-bottom: 1.75rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
          <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
        </div>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required
          style="padding: 0.75rem 1rem;">
      </div>

      <button type="submit" class="btn btn-primary"
        style="width: 100%; padding: 0.85rem; font-size: 1rem; border-radius: var(--radius-md); box-shadow: var(--shadow-md);">
        Sign In to Account &rarr;
      </button>
    </form>

    <p style="text-align: center; margin-top: 1.75rem; font-size: 0.92rem; color: var(--neutral-600);">
      Don't have an account yet?
      <a href="{{ url_for('register') }}" style="font-weight: 700; color: var(--primary-600);">Register as a Learner</a>
    </p>

  </div>
</div>
{% endblock %}
