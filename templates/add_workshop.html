{% extends "base.html" %}

{% block title %}Add New Workshop | Admin Panel{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 700px;">
  <div style="margin-bottom: 1.5rem;">
    <h2 style="font-size: 1.6rem; font-weight: 700;">Add New Workshop</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem;">Publish a new skill-building learning opportunity for the community</p>
  </div>

  <form method="POST" action="{{ url_for('add_workshop') }}">
    <div class="form-group">
      <label for="title" class="form-label">Workshop Title</label>
      <input type="text" id="title" name="title" class="form-control" placeholder="e.g., Introduction to Python & Automation" required autofocus>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label for="category" class="form-label">Category</label>
        <select id="category" name="category" class="form-control" required>
          <option value="" disabled selected>Select Category</option>
          <option value="Technology">Technology</option>
          <option value="Crafts & Trades">Crafts & Trades</option>
          <option value="Environment">Environment & Gardening</option>
          <option value="Finance">Finance & Business</option>
          <option value="Arts & Design">Arts & Design</option>
          <option value="Culinary Arts">Culinary Arts</option>
        </select>
      </div>

      <div class="form-group">
        <label for="trainer_name" class="form-label">Trainer / Instructor Name</label>
        <input type="text" id="trainer_name" name="trainer_name" class="form-control" placeholder="e.g., Dr. Robert Lee" required>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label for="workshop_date" class="form-label">Date (YYYY-MM-DD)</label>
        <input type="date" id="workshop_date" name="workshop_date" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="workshop_time" class="form-label">Time & Duration</label>
        <input type="text" id="workshop_time" name="workshop_time" class="form-control" placeholder="e.g., 10:00 AM - 01:00 PM" required>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
      <div class="form-group">
        <label for="venue" class="form-label">Venue / Room / Online Link</label>
        <input type="text" id="venue" name="venue" class="form-control" placeholder="e.g., Community Hall Room B" required>
      </div>

      <div class="form-group">
        <label for="total_seats" class="form-label">Total Seats</label>
        <input type="number" id="total_seats" name="total_seats" class="form-control" min="1" max="500" value="25" required>
      </div>
    </div>

    <div class="form-group">
      <label for="description" class="form-label">Detailed Workshop Description</label>
      <textarea id="description" name="description" class="form-control" rows="5" placeholder="Detail what participants will learn, required prerequisites, tools provided, etc." required></textarea>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
      <button type="submit" class="btn btn-primary" style="flex: 1;">Publish Workshop</button>
      <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
